<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>@nazzgab ♡</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #6f4b86;
      overflow: hidden;

      background:
        radial-gradient(circle at 20% 20%, #ffffffaa 0 4px, transparent 5px),
        radial-gradient(circle at 80% 30%, #ffffff99 0 3px, transparent 4px),
        radial-gradient(circle at 30% 80%, #ffffff99 0 3px, transparent 4px),
        linear-gradient(135deg, #eee0ff, #d9c1f5, #f1dcff);
      background-size: 180px 180px, 220px 220px, 260px 260px, cover;
    }

    .page {
      width: min(92%, 430px);
      text-align: center;
      padding: 35px 25px;
      position: relative;
      z-index: 2;
    }

    .decor {
      position: fixed;
      font-size: 25px;
      opacity: .7;
      animation: float 4s ease-in-out infinite;
      pointer-events: none;
    }

    .one {
      top: 8%;
      left: 10%;
    }

    .two {
      top: 18%;
      right: 9%;
      animation-delay: 1s;
    }

    .three {
      bottom: 12%;
      left: 12%;
      animation-delay: 2s;
    }

    .four {
      bottom: 20%;
      right: 10%;
      animation-delay: .5s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-12px) rotate(5deg);
      }
    }

    .avatar {
      width: 105px;
      height: 105px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: linear-gradient(135deg, #cba8ee, #f5e5ff);
      border: 5px solid #fff;
      box-shadow: 0 8px 25px #8d64aa55;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 42px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 7px;
      color: #70498b;
    }

    .subtitle {
      font-size: 14px;
      color: #8d6ba2;
      margin-bottom: 25px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: 100%;
      padding: 17px 20px;
      margin: 14px 0;

      border-radius: 18px;
      border: 2px solid #ffffffaa;

      color: #68457e;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;

      background: rgba(255, 255, 255, .62);
      box-shadow: 0 8px 20px #8d64aa30;

      backdrop-filter: blur(8px);

      transition: .25s ease;
    }

    .button:hover {
      transform: translateY(-4px) scale(1.02);
      background: #ffffffd9;
      box-shadow: 0 12px 25px #8d64aa50;
    }

    .pix {
      background: linear-gradient(135deg, #ead8ff, #f7eaff);
    }

    .discord {
      background: linear-gradient(135deg, #d9c1ff, #eee1ff);
    }

    .heart {
      font-size: 18px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #9273a5;
    }

    .sparkles {
      margin-top: 10px;
      letter-spacing: 5px;
      color: #9a73b5;
    }
  </style>
</head>

<body>

  <div class="decor one">♡</div>
  <div class="decor two">✦</div>
  <div class="decor three">🌷</div>
  <div class="decor four">♡</div>

  <main class="page">

    <div class="avatar">🎀</div>

    <h1>@nazzgab ♡</h1>

    <p class="subtitle">
      meu cantinho na internet ✨
    </p>

    <a
      class="button pix"
      href="https://livepix.gg/nazzgab"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="heart">💜</span>
      Apoie meu conteúdo • Live Pix
      <span>✨</span>
    </a>

    <a
      class="button discord"
      href="https://discord.gg/W9BMBNPA"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span>🎀</span>
      Entre no meu Discord
      <span>♡</span>
    </a>

    <div class="sparkles">
      ⋆｡°✩ ♡ ✩°｡⋆
    </div>

    <p class="footer">
      feito com carinho ♡
    </p>

  </main>

</body>
</html>
